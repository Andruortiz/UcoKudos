spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kudos}
spring.datasource.username=${DB_USER:kudos}
spring.datasource.password=${DB_PASSWORD:kudos}
spring.jpa.hibernate.ddl-auto=update


spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/seed-categories.sql
