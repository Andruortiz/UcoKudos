spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kudos}
spring.datasource.username=${DB_USER:kudos}
spring.datasource.password=${DB_PASSWORD:kudos}



# shortcut: default dev user (Ana). Switch with the X-Dev-User header.
kudos.dev.user-id=00000000-0000-0000-0000-000000000001

# true = no real login, the X-Dev-User header picks the user. Set false to test the Entra login locally.
kudos.dev-auth.enabled=false

# En local tambien se aplican las semillas de prueba (categorias y usuarios); en otros perfiles no
spring.flyway.locations=classpath:db/migration,classpath:db/local

# Correo de desarrollo: Mailpit (docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit). Los correos se ven en http://localhost:8025
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
# El despacho de notificaciones queda encendido solo en local
kudos.dispatch.enabled=true
