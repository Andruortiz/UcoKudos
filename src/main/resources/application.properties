spring.application.name=UcoKudos
spring.profiles.default=local


kudos.daily-limit=50
kudos.idempotency-window=PT1H
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

kudos.dispatch.enabled=false
kudos.dispatch.interval=PT30S
kudos.dispatch.batch-size=50
kudos.dispatch.max-attempts=5
kudos.dispatch.base-delay=PT1M
kudos.dispatch.link-base-url=http://localhost:5173/kudos/


kudos.messages.url=
kudos.messages.refresh-interval=PT1M

kudos.recipients.limit=20
kudos.recipients.recent-limit=10

# Microsoft Entra: tenant and app ids are public values, not secrets
kudos.dev-auth.enabled=false
kudos.cors.allowed-origins=http://localhost:5173
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${ENTRA_TENANT_ID:36f84d3d-a9fa-4302-8430-a675907c034d}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_CLIENT_ID:4acf7f6e-4bdc-4547-aa3f-2ebaa7cb48e6}

# Dominios de correo de la institucion. Aqui: el dominio del directorio de Entra. Con el directorio de la UCO seria uco.net.co
kudos.allowed-email-domains=${ENTRA_ALLOWED_DOMAINS:ucokudosgmail.onmicrosoft.com}
