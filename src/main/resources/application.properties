spring.application.name=UcoKudos
spring.profiles.default=local


kudos.daily-limit=50
kudos.idempotency-window=PT1H
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

kudos.dispatch.enabled=false
kudos.dispatch.interval=PT30S
kudos.dispatch.batch-size=50
kudos.dispatch.max-attempts=5
kudos.dispatch.base-delay=PT1M
kudos.dispatch.link-base-url=http://localhost:5173/kudos/


kudos.messages.url=
kudos.messages.refresh-interval=PT1M

kudos.recipients.limit=20
kudos.recipients.recent-limit=10
