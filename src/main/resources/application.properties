spring.application.name=UcoKudos
spring.profiles.default=local


kudos.daily-limit=50
kudos.idempotency-window=PT1H
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

kudos.dispatch.enabled=false
kudos.dispatch.interval=PT30S
kudos.dispatch.batch-size=50
kudos.dispatch.max-attempts=5
kudos.dispatch.base-delay=PT1M
kudos.dispatch.link-base-url=http://localhost:5173/kudos/


kudos.messages.url=
kudos.messages.refresh-interval=PT1M

kudos.recipients.limit=20
kudos.recipients.recent-limit=10

# Microsoft Entra: tenant and app ids are public values, not secrets
kudos.dev-auth.enabled=false
kudos.cors.allowed-origins=http://localhost:5173
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${ENTRA_TENANT_ID:36f84d3d-a9fa-4302-8430-a675907c034d}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_CLIENT_ID:4acf7f6e-4bdc-4547-aa3f-2ebaa7cb48e6}

# Dominios institucionales. El registro exige el correo de la persona; el inicio de sesion acepta ademas el dominio del directorio de Entra (cuentas de demostracion)
kudos.registration.allowed-email-domains=${REGISTRATION_ALLOWED_DOMAINS:uco.net.co,uco.edu.co,ucokudosgmail.onmicrosoft.com}
kudos.login.allowed-email-domains=${LOGIN_ALLOWED_DOMAINS:uco.net.co,uco.edu.co,ucokudosgmail.onmicrosoft.com}

# Flyway crea y cambia el esquema (db/migration); Hibernate solo comprueba que coincida con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

# Correo: el adaptador solo existe si spring.mail.host tiene valor. Quien envia es configuracion, no codigo (ADR-0008)
kudos.mail.from=${MAIL_FROM:no-reply@ucokudos.local}
spring.mail.default-encoding=UTF-8

# WhatsApp (ADR-0009): API en la nube de Meta con la plantilla aprobada. El adaptador solo existe si defines las variables
# KUDOS_WHATSAPP_TOKEN (token permanente) y KUDOS_WHATSAPP_PHONE_NUMBER_ID. El token nunca va en el repositorio.
kudos.whatsapp.base-url=https://graph.facebook.com
# Version de la API de Graph: confirma en la documentacion de Meta cual esta vigente
kudos.whatsapp.api-version=v22.0
kudos.whatsapp.template=kudo_recibido
kudos.whatsapp.language=es_CO

kudos.graph.login-url=https://login.microsoftonline.com
kudos.graph.base-url=https://graph.microsoft.com/v1.0
kudos.graph.tenant-id=${ENTRA_TENANT_ID:36f84d3d-a9fa-4302-8430-a675907c034d}
kudos.graph.client-id=
kudos.graph.client-secret=
kudos.graph.invite-redirect-url=https://kudos.ucokudos.qd.je

kudos.phone-verification.code-ttl=PT10M
kudos.phone-verification.resend-cooldown=PT1M
kudos.phone-verification.max-sends-per-hour=5
kudos.phone-verification.max-attempts=5

kudos.vonage.base-url=https://rest.nexmo.com
kudos.vonage.api-key=
kudos.vonage.api-secret=
kudos.vonage.from=UCOKudos
